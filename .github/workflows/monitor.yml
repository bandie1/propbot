name: XAUUSD Signal Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub may delay slightly under load)
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab too

permissions:
  contents: write   # needed so the workflow can commit state.json back to the repo

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run signal check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python check_signal.py

      - name: Commit updated state
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update state"
          git push
